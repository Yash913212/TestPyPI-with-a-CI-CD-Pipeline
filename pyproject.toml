[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yash913212-pyutil"
version = "0.0.1"
authors = [
  { name="Yash", email="yash913212@example.com" },
]
description = "A modern Python utility package for string operations and text processing"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = ["utility", "text", "testpypi", "cicd"]

[project.urls]
"Homepage" = "https://github.com/Yash913212/TestPyPI-with-a-CI-CD-Pipeline"
"Bug Tracker" = "https://github.com/Yash913212/TestPyPI-with-a-CI-CD-Pipeline/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
